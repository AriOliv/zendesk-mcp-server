# Build the deployment image (run with MCP_TRANSPORT=http for streamable HTTP).
#   gcloud builds submit --config cloudbuild.yaml --substitutions _TAG=v1 .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/zendesk-mcp:$_TAG", "."]
images:
  - "gcr.io/$PROJECT_ID/zendesk-mcp:$_TAG"
substitutions:
  _TAG: v1
options:
  logging: CLOUD_LOGGING_ONLY
